<figure class="chart">
  {% if !chart.legend.is_empty() %}
  <ul class="legend">
    {% for item in chart.legend %}<li><span class="key {{ item.slot }}" aria-hidden="true"></span>{{ item.name }}</li>{% endfor %}
  </ul>
  {% endif %}
  <svg viewBox="{{ chart.view_box }}" role="img" aria-label="{{ chart.description }}">
    {% for line in chart.grid %}
    <line class="grid" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ line.y }}" y2="{{ line.y }}"/>
    <text x="{{ chart.tick_x }}" y="{{ line.text_y }}" text-anchor="end">{{ line.label }}</text>
    {% endfor %}
    {% for bar in chart.bars %}
    {% for segment in bar.segments %}<path class="{{ segment.slot }}" d="{{ segment.path }}"><title>{{ segment.title }}</title></path>{% endfor %}
    {% if let Some(label) = bar.label %}<text x="{{ bar.center }}" y="{{ chart.label_y }}" text-anchor="middle">{{ label }}</text>{% endif %}
    {% endfor %}
  </svg>
  <details>
    <summary>Show as a table</summary>
    <div class="table-scroll">
      <table>
        <thead><tr>{% for head in chart.table_head %}<th{% if !loop.first %} class="num"{% endif %}>{{ head }}</th>{% endfor %}</tr></thead>
        <tbody>
          {% for row in chart.table_rows %}<tr>{% for cell in row %}<td{% if !loop.first %} class="num"{% endif %}>{{ cell }}</td>{% endfor %}</tr>{% endfor %}
        </tbody>
      </table>
    </div>
  </details>
</figure>
