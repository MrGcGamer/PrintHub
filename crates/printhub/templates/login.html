{% extends "base.html" %}
{% block title %}Log in · PrintHub{% endblock %}
{% block content %}
<form method="post" action="/login" class="panel narrow">
  <img class="login-logo" src="/static/logo.svg" alt="" width="64" height="64">
  <h1>Print<span class="hub">Hub</span></h1>
  {% if let Some(error) = error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <label>Username
    <input name="username" autocomplete="username" required value="{{ username }}" autofocus>
  </label>
  <label>Password
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
