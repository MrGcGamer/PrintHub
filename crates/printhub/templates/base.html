<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
<title>{% block title %}PrintHub{% endblock %}</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e1c" media="(prefers-color-scheme: dark)">
{% block head %}{% endblock %}
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/htmx-ext-sse.min.js" defer></script>
</head>
<body>
{% if let Some(user) = user %}
<header class="bar">
  <a href="/" class="brand"><img src="/static/logo.svg" alt="" width="28" height="28">PrintHub</a>
  <nav>
    <a href="/jobs">Queue</a>
    <a href="/inventory">Filament</a>
    <a href="/stats">Statistics</a>
    {% if user.is_admin() %}<a href="/admin/schedule">Print windows</a>
    <a href="/admin/users">Users</a>{% endif %}
    <a href="/wiki">Help</a>
    <a href="/account">{{ user.username }}</a>
    <form method="post" action="/logout"><button class="link">Log out</button></form>
  </nav>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
