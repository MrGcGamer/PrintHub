{% extends "base.html" %}
{% block content %}
<div class="grid">
  <section class="panel">
    <div aria-live="polite" hx-ext="sse" sse-connect="/events/printer" sse-swap="printer">
      {% include "printer_card.html" %}
    </div>
    {% if let Some(choices) = nozzle_choices %}
    <form method="post" action="/printer/nozzle" class="inline-form nozzle-form">
      <label>Mounted nozzle
        <select name="nozzle">
          {% for choice in choices %}<option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.value }} mm</option>{% endfor %}
        </select>
      </label>
      <button class="secondary">Record</button>
    </form>
    {% endif %}
  </section>
  <section class="panel camera">
    {% if camera_enabled %}
    <img src="/camera/stream" alt="Live view of the printer">
    <p class="muted"><a href="/camera/snapshot.jpg" target="_blank" rel="noopener">Open a still image</a></p>
    {% else %}
    <p class="muted">The camera is turned off.</p>
    {% endif %}
  </section>
</div>
<div id="control-result" role="status"></div>
{% endblock %}
