[workspace]
resolver = "3"
members = ["crates/printhub", "crates/fakeprinter"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
md-5 = "0.11.0"
# Printer endpoints are plain HTTP and MQTT, so both clients are built without TLS.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rumqttc = { version = "0.25.1", default-features = false }
rumqttd = { version = "0.20.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
